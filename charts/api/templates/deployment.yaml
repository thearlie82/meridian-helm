apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.testRunner.enabled .Values.cadConversion.enabled }}
      # Run under the launcher SA so the api can create + follow test-runner
      # and STEP-conversion Jobs in this namespace (see rbac.yaml /
      # serviceaccount.yaml).
      serviceAccountName: {{ .Values.testRunner.serviceAccountName }}
      {{- end }}
      # OpenShift restricted-v2: the namespace assigns UID/GID/fsGroup, so we
      # omit runAsUser/runAsGroup and only assert the hardening invariants.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Postgres connection string, published by the CNPG operator.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.uriKey }}
            # JWT signing secret (created out-of-band).
            - name: MERIDIAN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MERIDIAN_JWT_SECRET
            {{- if or .Values.testRunner.enabled .Values.cadConversion.enabled .Values.suiteDiscovery.enabled }}
            # The pod's own namespace (downward API): the test-runner and STEP
            # converter launchers land Jobs in this instance's namespace, no
            # override knob.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if .Values.testRunner.enabled }}
            {{- with .Values.testRunner.pullSecret }}
            # Image-pull secret name attached to launched runner Jobs so they
            # can pull private runner images. Referenced by name only.
            - name: MERIDIAN_TEST_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.cadConversion.enabled }}
            # STEP → GLB converter: one Job per conversion, run from the api's
            # own image with the api's pull secrets, calling back into the api
            # Service.
            - name: MERIDIAN_CAD_CONVERTER
              value: "kube"
            - name: MERIDIAN_API_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            {{- $pullSecrets := list }}
            {{- range .Values.global.imagePullSecrets }}
            {{- $pullSecrets = append $pullSecrets .name }}
            {{- end }}
            - name: MERIDIAN_API_IMAGE_PULL_SECRETS
              value: {{ join "," $pullSecrets | quote }}
            - name: MERIDIAN_INTERNAL_API_URL
              value: "http://{{ include "api.fullname" . }}:8080"
            - name: MERIDIAN_CAD_PART_NUMBER_PROPERTY
              value: {{ .Values.cadConversion.partNumberProperty | quote }}
            {{- end }}
            {{- with .Values.suiteDiscovery }}
            {{- if .enabled }}
            # MPP suite discovery + GitHub package browsing (see values).
            - name: MERIDIAN_SUITE_DISCOVER
              value: "kube"
            - name: MERIDIAN_SUITE_DISCOVER_TIMEOUT_SECS
              value: {{ .discoverTimeoutSecs | quote }}
            - name: MERIDIAN_SUITE_BUILD_READER
              value: {{ .buildReader | quote }}
            - name: MERIDIAN_SUITE_TRACK_INTERVAL_SECS
              value: {{ .trackIntervalSecs | quote }}
            - name: MERIDIAN_SUITE_GITHUB_ORG
              value: {{ .githubOrg | quote }}
            - name: MERIDIAN_SUITE_NAME_SUFFIX
              value: {{ .nameSuffix | quote }}
            - name: MERIDIAN_SUITE_EXTRA_PACKAGES
              value: {{ .extraPackages | quote }}
            - name: MERIDIAN_SUITE_ALLOWED_REGISTRIES
              value: {{ .allowedRegistries | quote }}
            - name: MERIDIAN_SUITE_GITHUB_APP_KIND
              value: {{ .githubAppKind | quote }}
            - name: MERIDIAN_SUITE_GITHUB_CLIENT_ID
              value: {{ .githubClientId | quote }}
            - name: MERIDIAN_SUITE_GITHUB_CALLBACK_URL
              value: {{ .githubCallbackUrl | quote }}
            - name: MERIDIAN_WEB_ORIGIN
              value: {{ .webOrigin | quote }}
            - name: MERIDIAN_SUITE_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .githubClientSecretName }}
                  key: client_secret
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.xjtag }}
            {{- if .enabled }}
            # XJTAG package pull from Quay: SA token -> OpenBao -> OIDC JWT ->
            # Quay robot federation (see values). No static credential.
            - name: MERIDIAN_XJTAG_QUAY_URL
              value: {{ .quayUrl | quote }}
            - name: MERIDIAN_XJTAG_OPENBAO_ADDR
              value: {{ .openbao.addr | quote }}
            - name: MERIDIAN_XJTAG_OPENBAO_ROLE
              value: {{ .openbao.role | quote }}
            - name: MERIDIAN_XJTAG_SA_TOKEN_PATH
              value: "/var/run/secrets/openbao/token"
            - name: MERIDIAN_XJTAG_QUAY_CA_FILE
              value: "/etc/meridian/quay-ca/ca.crt"
            - name: MERIDIAN_XJTAG_PULL_ROBOT_TEMPLATE
              value: {{ .pullRobotTemplate | quote }}
            {{- with .maxPackageBytes }}
            - name: MERIDIAN_XJTAG_MAX_PACKAGE_BYTES
              {{- /* An unquoted YAML number arrives as float64; print it as an integer. */}}
              value: {{ kindIs "float64" . | ternary (int64 .) . | quote }}
            {{- end }}
            {{- with .ghesApi }}
            - name: MERIDIAN_XJTAG_GHES_API
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Additional secret-backed env vars (e.g. AWS creds for the
                   Bedrock assist backend). Each entry names a key that must
                   exist in `secretName`; values are never rendered into the
                   chart, only referenced. */}}
            {{- range .Values.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ . }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            # Where the engineering file store (CAD models, step media) writes.
            - name: MERIDIAN_ENGINEERING_FILE_ROOT
              value: {{ .Values.persistence.mountPath | quote }}
            # Documents file versions, on the same volume.
            - name: MERIDIAN_DOCUMENTS_FILE_ROOT
              value: "{{ .Values.persistence.mountPath }}/documents"
            {{- end }}
            {{- with .Values.documents.collabora }}
            {{- if .url }}
            # Collabora side-car (Documents editing and search text): the api
            # calls it at url, the browser reaches it same-origin through the
            # web tier, and it calls back to the api at wopiSrcBase.
            - name: MERIDIAN_COLLABORA_URL
              value: {{ .url | quote }}
            - name: MERIDIAN_COLLABORA_PUBLIC_BASE
              value: {{ .publicBase | quote }}
            - name: MERIDIAN_WOPI_SRC_BASE
              value: {{ .wopiSrcBase | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.xjtag.enabled }}
          {{- if .Values.persistence.enabled }}
          # The root filesystem is read-only; uploaded engineering files live
          # on this volume instead.
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: engineering-files
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.xjtag.enabled }}
            # Projected SA token for the OpenBao kubernetes login (XJTAG pull).
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            # ADT Dev Registry Root CA, Quay's TLS issuer.
            - name: quay-ca
              mountPath: /etc/meridian/quay-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.xjtag.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: engineering-files
          persistentVolumeClaim:
            claimName: {{ include "api.fullname" . }}-engineering-files
        {{- end }}
        {{- if .Values.xjtag.enabled }}
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.xjtag.openbao.audience | quote }}
                  expirationSeconds: {{ int .Values.xjtag.openbao.tokenExpirationSeconds }}
                  path: token
        - name: quay-ca
          configMap:
            name: {{ .Values.xjtag.quayCa.configMap }}
            items:
              - key: {{ .Values.xjtag.quayCa.key }}
                path: ca.crt
        {{- end }}
      {{- end }}
