# Defaults for the api subchart. The umbrella chart's `api:` block overrides
# these; `global:` is shared from the umbrella.
enabled: true
replicaCount: 1
image:
  repository: containers.adt-git01.adt.network/adrian-thearle/meridian-api
  tag: latest
  pullPolicy: Always
secretName: meridian-secrets
# Names of additional keys in `secretName` to inject as env via secretKeyRef.
# Empty by default; environments that enable a live assist backend add the
# relevant credential keys (e.g. AWS_ACCESS_KEY_ID) here.
secretEnv: []
database:
  secretName: meridian-pg-app
  uriKey: uri
env:
  RUST_LOG: "info"
  MERIDIAN_SEED: "false"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
# Engineering file store (uploaded CAD models, step media). The container's
# root filesystem is read-only, so uploads need this volume. ReadWriteOnce is
# fine for one replica; more replicas need a ReadWriteMany class.
persistence:
  enabled: true
  mountPath: /var/lib/meridian/engineering-files
  size: 10Gi
  accessMode: ReadWriteOnce
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
# Documents editing via the Collabora side-car (umbrella `collabora`). Empty
# url = Collabora off (no editing, no search-text extraction).
documents:
  collabora:
    url: ""
    publicBase: ""
    wopiSrcBase: http://meridian-api:8080
route:
  enabled: true
  host: meridian-api.apps-crc.testing
  path: /
# Test-runner launcher. When enabled, the api runs under a dedicated
# ServiceAccount granted namespaced RBAC to create + follow the third-party
# runner Jobs of the `openshift_batch_job` test type (they launch into this
# instance's own namespace). Cross-namespace placement is future in-app config.
testRunner:
  enabled: true
  serviceAccountName: meridian-test-launcher
  # Name of a pre-provisioned dockerconfigjson pull secret with creds for the
  # registry hosting private runner images. Created out-of-band (like the other
  # pull secrets) and referenced here by name only; empty disables the env.
  pullSecret: ""
# STEP → GLB converter. When enabled the api launches one Kubernetes Job per
# conversion from its OWN image (MERIDIAN_API_IMAGE) with the api's pull
# secrets; the Job calls back into the api Service with a scoped token and
# mounts no volume and no DB secret. Needs the Job RBAC below.
# MPP automated-test authoring: the api discovers a suite image by running it
# in `discover` mode as a Job, and lets engineers browse the org's suite
# packages after a GitHub sign-in (classic OAuth App, scope read:packages).
# The client secret lives in a pre-provisioned Secret, referenced by name only;
# without it sign-in reports unavailable and pasting a reference still works.
suiteDiscovery:
  enabled: true
  githubOrg: "Advanced-Design-Technology"
  nameSuffix: "_test"
  # Packages shown when browsing whatever their suffix (comma-separated).
  extraPackages: "kvmbontester"
  allowedRegistries: "ghcr.io,quay.apps.cluster.adt.network"
  githubAppKind: "oauth_app"
  githubClientId: "Ov23lilNi8h6RS0LmzPs"
  # Served through the web origin (nginx proxies /api/), so the sign-in
  # pop-up and the editor are same-origin and the callback can hand the code
  # to the signed-in editor with a strict origin check.
  githubCallbackUrl: "https://meridian.apps.cluster.adt.network/api/v1/engineering/suite-registry/github/callback"
  webOrigin: "https://meridian.apps.cluster.adt.network"
  githubClientSecretName: "meridian-github-app"
  discoverTimeoutSecs: "180"
  # Build provenance + "newer build" reads (ghcr | noop) and the hourly
  # track-HEAD sweep ("0" turns the sweep off).
  buildReader: "ghcr"
  trackIntervalSecs: "3600"
cadConversion:
  enabled: true
  partNumberProperty: "PLM_PART_NUMBER"
  # ResourceQuota on Job objects in the namespace (converter + test runner).
  maxJobs: 30
# XJTAG package pull from Quay (keyless). The api exchanges its projected
# ServiceAccount token for an OpenBao client token (kubernetes auth), mints an
# OIDC JWT, and trades that at Quay's robot federation endpoint for a pull
# token on the org's robot. No static registry or GHES credential is mounted.
# Off by default; while disabled nothing below renders.
#
# The OpenBao role binds the pod's ServiceAccount, which is
# testRunner.serviceAccountName (meridian-test-launcher). If that name changes,
# meridian-infra `var.meridian_api_service_account` must change with it, or the
# OpenBao login fails.
xjtag:
  enabled: false
  # Quay base URL (MERIDIAN_XJTAG_QUAY_URL).
  quayUrl: https://quay.apps.cluster.adt.network
  # Robot per Quay org; {org} is the lower-cased GHES repo owner.
  pullRobotTemplate: "{org}+meridian_xjtag_pull"
  openbao:
    addr: http://openbao.openbao.svc:8200
    role: meridian-xjtag-pull
    # Audience and lifetime of the projected SA token mounted at
    # /var/run/secrets/openbao/token. The audience must match the OpenBao
    # role's bound audience. Kubelet rotates it at about 80% of its life.
    audience: openbao
    tokenExpirationSeconds: 600
  # ConfigMap in the release namespace holding the ADT Dev Registry Root CA
  # (Quay's issuer), mounted at /etc/meridian/quay-ca/ca.crt. Created
  # out-of-band from openshift-config/registry-certs
  # ["quay.apps.cluster.adt.network"].
  quayCa:
    configMap: meridian-quay-ca
    key: ca.crt
  # GHES REST base (MERIDIAN_XJTAG_GHES_API); empty leaves Meridian's default
  # https://adt-git01.adt.network/api/v3.
  ghesApi: ""
  # Size cap per package blob (MERIDIAN_XJTAG_MAX_PACKAGE_BYTES); empty leaves
  # Meridian's default.
  maxPackageBytes: ""
