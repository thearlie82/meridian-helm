# Defaults for the api subchart. The umbrella chart's `api:` block overrides
# these; `global:` is shared from the umbrella.
enabled: true
replicaCount: 1
image:
  repository: containers.adt-git01.adt.network/adrian-thearle/meridian-api
  tag: latest
  pullPolicy: Always
secretName: meridian-secrets
# Names of additional keys in `secretName` to inject as env via secretKeyRef.
# Empty by default; environments that enable a live assist backend add the
# relevant credential keys (e.g. AWS_ACCESS_KEY_ID) here.
secretEnv: []
database:
  secretName: meridian-pg-app
  uriKey: uri
env:
  RUST_LOG: "info"
  MERIDIAN_SEED: "false"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
route:
  enabled: true
  host: meridian-api.apps-crc.testing
  path: /
# Test-runner launcher. When enabled, the api runs under a dedicated
# ServiceAccount granted namespaced RBAC to create + follow the third-party
# runner Jobs of the `openshift_batch_job` test type (they launch into this
# instance's own namespace). Cross-namespace placement is future in-app config.
testRunner:
  enabled: true
  serviceAccountName: meridian-test-launcher
  # Name of a pre-provisioned dockerconfigjson pull secret with creds for the
  # registry hosting private runner images. Created out-of-band (like the other
  # pull secrets) and referenced here by name only; empty disables the env.
  pullSecret: ""
