# Defaults for the api subchart. The umbrella chart's `api:` block overrides
# these; `global:` is shared from the umbrella.
enabled: true
replicaCount: 1
image:
  repository: containers.adt-git01.adt.network/adrian-thearle/meridian-api
  tag: latest
  pullPolicy: Always
secretName: meridian-secrets
# Names of additional keys in `secretName` to inject as env via secretKeyRef.
# Empty by default; environments that enable a live assist backend add the
# relevant credential keys (e.g. AWS_ACCESS_KEY_ID) here.
secretEnv: []
database:
  secretName: meridian-pg-app
  uriKey: uri
env:
  RUST_LOG: "info"
  MERIDIAN_SEED: "false"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
route:
  enabled: true
  host: meridian-api.apps-crc.testing
  path: /
