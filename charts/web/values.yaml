# Defaults for the web subchart. The umbrella chart's `web:` block overrides
# these; `global:` is shared from the umbrella.
enabled: true
replicaCount: 1
image:
  repository: ghcr.io/thearlie82/meridian-web
  tag: latest
  pullPolicy: Always
apiUpstream: http://meridian-api:8080
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
route:
  enabled: true
  host: meridian.apps-crc.testing
  path: /
