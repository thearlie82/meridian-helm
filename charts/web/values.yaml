# Defaults for the web subchart. The umbrella chart's `web:` block overrides
# these; `global:` is shared from the umbrella.
enabled: true
replicaCount: 1
image:
  repository: containers.adt-git01.adt.network/adrian-thearle/meridian-web
  tag: latest
  pullPolicy: Always
apiUpstream: http://meridian-api:8080
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
route:
  enabled: true
  host: meridian.apps-crc.testing
  path: /
  # Additional hostnames served by the same service, one extra Route each
  # (named <web fullname>-<name>; same path, target port and TLS as the main
  # Route). Each entry: { name: string, host: string }. Empty = single Route.
  extraHosts: []
