# Meridian - default values (dev-safe). Per-environment overrides live in
# adt-grc-gitops: environments/meridian/<env>/values.yaml
#
# Secrets are NEVER committed. The API consumes two secrets that must exist in
# the namespace before sync:
#   - <cnpg.clusterName>-app  (created automatically by the CNPG operator; holds
#                              the connection `uri` used as DATABASE_URL)
#   - meridian-secrets        (created out-of-band: oc create secret generic
#                              meridian-secrets --from-literal=MERIDIAN_JWT_SECRET=...)

global:
  imageRegistry: containers.adt-git01.adt.network/adrian-thearle
  imagePullSecrets:
    - name: ghes-pull-secret
  namespace: meridian

# --- Postgres (CloudNativePG operator) --------------------------------------
# The operator provisions the cluster and publishes a Secret named
# "<clusterName>-app" whose `uri` key is a ready-to-use libpq connection string.
cnpg:
  enabled: true
  clusterName: meridian-pg
  instances: 1
  storageSize: 10Gi
  storageClass: ""   # empty = cluster default
  imageName: ""      # empty = operator default
  # initdb database + owner. The `uri` in <clusterName>-app targets this db.
  database: meridian
  owner: meridian

# --- API (Rust / axum) ------------------------------------------------------
api:
  enabled: true
  replicaCount: 1
  image:
    repository: containers.adt-git01.adt.network/adrian-thearle/meridian-api
    tag: latest
    pullPolicy: Always
  # Secret holding MERIDIAN_JWT_SECRET (created out-of-band).
  secretName: meridian-secrets
  # CNPG-published secret + key that carry the Postgres connection string.
  database:
    secretName: meridian-pg-app
    uriKey: uri
  env:
    RUST_LOG: "info"
    MERIDIAN_SEED: "false"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Documents editing via the Collabora side-car (see collabora below). Empty
  # url = Collabora off (no editing, no search-text extraction). Set
  # url: http://collabora:9980 together with collabora.enabled.
  documents:
    collabora:
      url: ""                               # MERIDIAN_COLLABORA_URL
      publicBase: ""                        # MERIDIAN_COLLABORA_PUBLIC_BASE; empty = same origin (web nginx)
      wopiSrcBase: http://meridian-api:8080 # MERIDIAN_WOPI_SRC_BASE (the api as Collabora reaches it)
  # The API is exposed directly for external automation (complete API surface).
  route:
    enabled: true
    host: meridian-api.apps-crc.testing
    path: /

# --- Web (React SPA behind nginx) -------------------------------------------
web:
  enabled: true
  replicaCount: 1
  image:
    repository: containers.adt-git01.adt.network/adrian-thearle/meridian-web
    tag: latest
    pullPolicy: Always
  # In-cluster upstream the SPA proxies /api/ to (the api Service).
  apiUpstream: http://meridian-api:8080
  # Collabora upstream nginx proxies /browser/, /hosting/ and /cool/ to
  # (COLLABORA_UPSTREAM). Set it to http://collabora:9980 only together with
  # collabora.enabled: nginx refuses to start on a host that doesn't resolve,
  # and the chart fails to render if it is set while Collabora is off. Empty
  # leaves the image default (no DNS; Collabora's paths answer 502).
  collaboraUpstream: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Public browser entrypoint.
  route:
    enabled: true
    host: meridian.apps-crc.testing
    path: /

# --- Collabora Online (CODE): the Documents editor side-car -----------------
# Official collabora-online chart (vendored in charts/), aliased `collabora`.
# The web tier proxies it same-origin; it reaches the API only through the
# aliasgroup below (WOPI at /api/v1/internal/wopi). Turning it on takes three
# values together: collabora.enabled, api.documents.collabora.url and
# web.collaboraUpstream (see README "Collabora side-car").
collabora:
  enabled: false
  # Service/Deployment name `collabora` (http://collabora:9980) and pod label
  # app.kubernetes.io/name=collabora (the NetworkPolicy selects on it).
  fullnameOverride: collabora
  nameOverride: collabora
  image:
    repository: docker.io/collabora/code
    tag: "26.04.6.1.1"
  # Rendered by templates/collabora-serviceaccount.yaml (no token mounted).
  serviceAccount:
    create: false
    name: meridian-collabora
  # One replica: documents are not sharded across pods, so no session
  # affinity is needed. The upstream default turns an HPA on (min 2).
  replicaCount: 1
  autoscaling:
    enabled: false
  collabora:
    # The only WOPI host Collabora accepts.
    aliasgroups:
      - host: "http://meridian-api:8080"
    # Per environment: TLS ends at the router, Collabora is framed only by the
    # web origin, and POST/REST (convert-to) is limited to the pod network.
    # admin_console off (also disables /cool/getMetrics).
    extra_params: >-
      --o:ssl.enable=false --o:ssl.termination=true
      --o:admin_console.enable=false
    # The public host the browser uses (the web Route host).
    server_name: null
    # Admin console is off (extra_params), so these are never used; the
    # upstream chart still renders them into its Secret.
    username: unused
    password: unused
  # OpenShift restricted-v2: the namespace assigns the UID (the image's 1001
  # is ignored), no capabilities, no privilege escalation. Collabora then
  # isolates its document processes with landlock instead of a chroot jail.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # /opt/cool/{child-roots,cache} are owned by 1001 in the image, so the
  # assigned UID can't write them; give it emptyDirs (/tmp is one already).
  extraVolumes:
    - name: child-roots
      emptyDir: {}
    - name: cache
      emptyDir: {}
  extraVolumeMounts:
    - name: child-roots
      mountPath: /opt/cool/child-roots
    - name: cache
      mountPath: /opt/cool/cache
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 6Gi
  # The chart's own NetworkPolicy can't select pods for egress; this chart
  # renders templates/collabora-networkpolicy.yaml instead.
  networkPolicy:
    enabled: false
