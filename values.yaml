# Meridian - default values (dev-safe). Per-environment overrides live in
# adt-grc-gitops: environments/meridian/<env>/values.yaml
#
# Secrets are NEVER committed. The API consumes two secrets that must exist in
# the namespace before sync:
#   - <cnpg.clusterName>-app  (created automatically by the CNPG operator; holds
#                              the connection `uri` used as DATABASE_URL)
#   - meridian-secrets        (created out-of-band: oc create secret generic
#                              meridian-secrets --from-literal=MERIDIAN_JWT_SECRET=...)

global:
  imageRegistry: containers.adt-git01.adt.network/adrian-thearle
  imagePullSecrets:
    - name: ghes-pull-secret
  namespace: meridian

# --- Postgres (CloudNativePG operator) --------------------------------------
# The operator provisions the cluster and publishes a Secret named
# "<clusterName>-app" whose `uri` key is a ready-to-use libpq connection string.
cnpg:
  enabled: true
  clusterName: meridian-pg
  instances: 1
  storageSize: 10Gi
  storageClass: ""   # empty = cluster default
  imageName: ""      # empty = operator default
  # initdb database + owner. The `uri` in <clusterName>-app targets this db.
  database: meridian
  owner: meridian
  # The DB viewer's own Postgres login (managed role meridian_dbviewer and the
  # generated Secret <clusterName>-dbviewer; Meridian DEPLOY.md 16.2). Off:
  # the DB viewer answers 503.
  dbViewer:
    enabled: false
    connectionLimit: 8
  # The audit tables' owner (meridian_audit, NOLOGIN) and the migration Job's
  # login (meridian_migrator, Secret <clusterName>-migrator generated in the
  # cluster; Meridian DEPLOY.md 18). Needed by the audit migrations.
  auditRoles:
    enabled: false
    migratorConnectionLimit: 2

# --- API (Rust / axum) ------------------------------------------------------
api:
  enabled: true
  replicaCount: 1
  image:
    repository: containers.adt-git01.adt.network/adrian-thearle/meridian-api
    tag: latest
    pullPolicy: Always
  # Secret holding MERIDIAN_JWT_SECRET (created out-of-band).
  secretName: meridian-secrets
  # CNPG-published secret + key that carry the Postgres connection string.
  database:
    secretName: meridian-pg-app
    uriKey: uri
    # The DB viewer's connection string (MERIDIAN_DBVIEWER_DATABASE_URL), from
    # the Secret cnpg.dbViewer creates. Empty: not set (the DB viewer is 503).
    viewerSecretName: ""
    viewerUriKey: uri
    # The migration Job's connection string (MERIDIAN_MIGRATOR_DATABASE_URL),
    # from the Secret cnpg.auditRoles creates.
    migratorSecretName: ""
    migratorUriKey: uri
  # `meridian-api migrate` as meridian_migrator before each rollout (DEPLOY.md
  # 17): needs cnpg.auditRoles and database.migratorSecretName.
  migrationJob:
    enabled: false
    backoffLimit: 10
    activeDeadlineSeconds: 1800
  # MERIDIAN_ENV (always rendered): `production` refuses the dev-only
  # switches at startup; a dev cluster sets `dev`. Not settable under `env`.
  meridianEnv: production
  env:
    RUST_LOG: "info"
    MERIDIAN_SEED: "false"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Documents editing via the Collabora side-car (see collabora below). Empty
  # url = Collabora off (no editing, no search-text extraction). Set
  # url: http://collabora:9980 together with collabora.enabled.
  documents:
    collabora:
      url: ""                               # MERIDIAN_COLLABORA_URL
      publicBase: ""                        # MERIDIAN_COLLABORA_PUBLIC_BASE; empty = same origin (web nginx)
      wopiSrcBase: http://meridian-api:8080 # MERIDIAN_WOPI_SRC_BASE (the api as Collabora reaches it)
  # Projected ServiceAccount token (aud openbao) for the api's OpenBao
  # kubernetes logins: Documents encryption keys (MERIDIAN_KEYS_*) and
  # webhook signing. Independent of xjtag (which mounts the same token).
  # The OpenBao role meridian-keys binds the api's ServiceAccount
  # (testRunner.serviceAccountName); see the api subchart values.
  openbaoToken:
    enabled: false
  keys:
    openbaoAddr: http://openbao.openbao.svc:8200
    openbaoRole: meridian-keys
  # The API is exposed directly for external automation (complete API surface).
  route:
    enabled: true
    host: meridian-api.apps-crc.testing
    path: /

# --- Web (React SPA behind nginx) -------------------------------------------
web:
  enabled: true
  replicaCount: 1
  image:
    repository: containers.adt-git01.adt.network/adrian-thearle/meridian-web
    tag: latest
    pullPolicy: Always
  # In-cluster upstream the SPA proxies /api/ to (the api Service).
  apiUpstream: http://meridian-api:8080
  # Collabora upstream nginx proxies /browser/, /hosting/ and /cool/ to
  # (COLLABORA_UPSTREAM). Set it to http://collabora:9980 only together with
  # collabora.enabled: nginx refuses to start on a host that doesn't resolve,
  # and the chart fails to render if it is set while Collabora is off. Empty
  # leaves the image default (no DNS; Collabora's paths answer 502).
  collaboraUpstream: ""
  # Realtime gateway upstream nginx proxies /rt to (RT_UPSTREAM). Set it to
  # http://meridian-realtime:8080 only together with realtime.enabled (the
  # chart refuses to render otherwise). Empty leaves the image default (no
  # DNS; /rt answers 502).
  rtUpstream: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Public browser entrypoint.
  route:
    enabled: true
    host: meridian.apps-crc.testing
    path: /

# --- Collabora Online (CODE): the Documents editor side-car -----------------
# Official collabora-online chart (vendored in charts/), aliased `collabora`.
# The web tier proxies it same-origin; it reaches the API only through the
# aliasgroup below (WOPI at /api/v1/internal/wopi). Turning it on takes three
# values together: collabora.enabled, api.documents.collabora.url and
# web.collaboraUpstream (see README "Collabora side-car").
collabora:
  enabled: false
  # Service/Deployment name `collabora` (http://collabora:9980) and pod label
  # app.kubernetes.io/name=collabora (the NetworkPolicy selects on it).
  fullnameOverride: collabora
  nameOverride: collabora
  image:
    repository: docker.io/collabora/code
    tag: "26.04.6.1.1"
  # Rendered by templates/collabora-serviceaccount.yaml (no token mounted).
  serviceAccount:
    create: false
    name: meridian-collabora
  # One replica: documents are not sharded across pods, so no session
  # affinity is needed. The upstream default turns an HPA on (min 2).
  replicaCount: 1
  autoscaling:
    enabled: false
  collabora:
    # The only WOPI host Collabora accepts (with alias_groups mode=groups in
    # extra_params).
    aliasgroups:
      - host: "http://meridian-api:8080"
    # Per environment: TLS ends at the router, Collabora is framed only by the
    # web origin, and post_allow (POST/REST such as convert-to) is the pod
    # network. post_allow can't separate browsers: they all arrive from the
    # web pods, so the web nginx's allow-list is what keeps the REST
    # endpoints off the public Route. alias_groups mode=groups makes the
    # aliasgroups above the only trusted WOPI hosts: the default mode
    # ("first") ignores them and trusts whichever host connects first, and
    # the aliasgroupN env doesn't switch it. admin_console off.
    # enable_websocket_urp stays false (its default), set explicitly: UNO
    # remote protocol over the editor WebSocket would bypass every WOPI flag.
    # An environment that overrides extra_params must keep these lines.
    extra_params: >-
      --o:ssl.enable=false --o:ssl.termination=true
      --o:storage.wopi.alias_groups[@mode]=groups
      --o:admin_console.enable=false
      --o:security.enable_websocket_urp=false
    # The public host the browser uses (the web Route host).
    server_name: null
    # Admin console is off (extra_params), so these are never used; the
    # upstream chart still renders them into its Secret.
    username: unused
    password: unused
  # OpenShift restricted-v2: the namespace assigns the UID (the image's 1001
  # is ignored), no capabilities, no privilege escalation. Collabora then
  # isolates its document processes with landlock instead of a chroot jail.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # /opt/cool/{child-roots,cache} are owned by 1001 in the image, so the
  # assigned UID can't write them; give it emptyDirs (/tmp is one already).
  extraVolumes:
    - name: child-roots
      emptyDir: {}
    - name: cache
      emptyDir: {}
  extraVolumeMounts:
    - name: child-roots
      mountPath: /opt/cool/child-roots
    - name: cache
      mountPath: /opt/cool/cache
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 6Gi
  # The chart's own NetworkPolicy can't select pods for egress; this chart
  # renders templates/collabora-networkpolicy.yaml instead.
  networkPolicy:
    enabled: false

# --- NATS: the realtime gateway's internal fan-out bus ----------------------
# Official nats chart (vendored in charts/), aliased `nats`. NATS core only
# (no JetStream, no cluster): presence fan-out between realtime replicas,
# nothing stored. Browsers never reach it; templates/nats-networkpolicy.yaml
# admits only the api and realtime pods. Turn it on together with
# realtime.enabled (see README "Realtime gateway and NATS").
nats:
  enabled: false
  # Service/StatefulSet `nats` (nats://nats:4222, MERIDIAN_NATS_URL's
  # default) and pod label app.kubernetes.io/name=nats.
  fullnameOverride: nats
  nameOverride: nats
  config:
    cluster:
      enabled: false
    jetstream:
      enabled: false
    # The probes use the monitor port (8222); the Service doesn't expose it.
    monitor:
      enabled: true
  container:
    image:
      repository: nats
      registry: docker.io
      tag: 2.15.2-alpine
    # OpenShift restricted-v2: the namespace assigns the UID.
    merge:
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
  podTemplate:
    merge:
      spec:
        # NATS calls no Kubernetes API.
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
  # Config never changes at runtime: no reloader side-car.
  reloader:
    enabled: false
  # No nats-box (a debug client Deployment).
  natsBox:
    enabled: false
  # The meridian Argo CD project doesn't allow group `policy`, and dev is one
  # replica on one node: no PodDisruptionBudget.
  podDisruptionBudget:
    enabled: false
  # No PodMonitor (group monitoring.coreos.com is not allowed either).
  promExporter:
    enabled: false
    podMonitor:
      enabled: false

# --- Realtime gateway (meridian-realtime) -----------------------------------
# Browser WebSocket sessions at /rt (the web nginx proxies it same-origin;
# set web.rtUpstream). Runs from the api image with command
# /app/meridian-realtime and NATS at natsUrl. It holds no secret and no
# database access: tickets and access are checked by the api at apiUrl
# (cluster-only /api/v1/internal/realtime). Needs nats.enabled (the chart
# refuses to render otherwise).
realtime:
  enabled: false
  replicaCount: 1
  natsUrl: nats://nats:4222
  # The api Service (MERIDIAN_REALTIME_API_URL).
  apiUrl: http://meridian-api:8080
  env:
    RUST_LOG: "info"
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi
