{{- if and .Values.cnpg.enabled .Values.cnpg.auditRoles.enabled }}
{{- /*
The migration Job's Postgres login (meridian_migrator; Meridian DEPLOY.md
17). Generated in the cluster, never in git, exactly like the DB viewer's
(cnpg-dbviewer-secret.yaml explains why the value survives helm upgrades and
Argo CD syncs: `lookup`, values under `data`, ignoreDifferences on
/data/password and /data/uri with RespectIgnoreDifferences=true). CNPG sets
it on the managed role; only the migration Job mounts `uri`
(MERIDIAN_MIGRATOR_DATABASE_URL). The api never sees it.
*/}}
{{- $name := printf "%s-migrator" .Values.cnpg.clusterName }}
{{- $ns := .Values.global.namespace }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- $data := dict }}
{{- if and $existing $existing.data (index $existing.data "password") (index $existing.data "uri") }}
{{- $_ := set $data "password" (index $existing.data "password") }}
{{- $_ := set $data "uri" (index $existing.data "uri") }}
{{- else }}
{{- $password := randAlphaNum 40 }}
{{- $_ := set $data "password" ($password | b64enc) }}
{{- $_ := set $data "uri" (printf "postgresql://meridian_migrator:%s@%s-rw.%s.svc:5432/%s" $password .Values.cnpg.clusterName $ns .Values.cnpg.database | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    cnpg.io/reload: "true"
  annotations:
    helm.sh/resource-policy: keep
data:
  username: {{ "meridian_migrator" | b64enc }}
  password: {{ $data.password }}
  uri: {{ $data.uri }}
{{- end }}
