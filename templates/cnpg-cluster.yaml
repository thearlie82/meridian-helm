{{- if .Values.cnpg.enabled }}
# CloudNativePG Cluster. The operator provisions Postgres and publishes a Secret
# named "{{ .Values.cnpg.clusterName }}-app" containing a `uri` key that the API
# consumes as DATABASE_URL. Requires ServerSideApply (set on the Argo CD app).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.clusterName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.cnpg.instances }}
  {{- with .Values.cnpg.imageName }}
  imageName: {{ . }}
  {{- end }}
  postgresql:
    parameters:
      # Never log bind parameters (statement and error logs): Documents binds
      # plaintext search chunks into to_tsvector, so a logged parameter
      # would write file contents to the Postgres log.
      log_parameter_max_length: "0"
      log_parameter_max_length_on_error: "0"
  {{- if .Values.cnpg.dbViewer.enabled }}
  # The DB viewer's own login (Meridian DEPLOY.md 16.2): a plain LOGIN role,
  # a member of nothing (the api refuses any membership either way), no
  # CREATEDB/CREATEROLE/BYPASSRLS/REPLICATION. The api's startup grants it
  # SELECT on its allowlist and sets its read-only session defaults.
  managed:
    roles:
      - name: meridian_dbviewer
        ensure: present
        comment: Meridian DB viewer (read-only, allowlisted tables)
        login: true
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        connectionLimit: {{ .Values.cnpg.dbViewer.connectionLimit }}
        inRoles: []
        passwordSecret:
          name: {{ .Values.cnpg.clusterName }}-dbviewer
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
  storage:
    size: {{ .Values.cnpg.storageSize }}
    {{- with .Values.cnpg.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  monitoring:
    enablePodMonitor: false
{{- end }}
