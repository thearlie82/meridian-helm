{{- if .Values.collabora.enabled }}
# Collabora needs no kube API access: its own ServiceAccount, with no token
# mounted (the upstream chart would otherwise run it as `default`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.collabora.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: collabora
automountServiceAccountToken: false
{{- end }}
