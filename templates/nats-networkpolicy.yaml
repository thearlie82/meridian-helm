{{- if .Values.nats.enabled }}
# NATS (the realtime bus) has no authentication: only the api and realtime
# pods may connect (4222), and it connects to nothing (no cluster routes,
# leafnodes or JetStream). The kubelet's probes on 8222 come from the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meridian-nats
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: realtime
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 4222
  egress: []
{{- end }}
