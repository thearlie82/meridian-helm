{{- if and .Values.cnpg.enabled .Values.cnpg.dbViewer.enabled }}
{{- /*
The DB viewer's own Postgres login (meridian_dbviewer; Meridian DEPLOY.md
16.2). Like the app owner's "<clusterName>-app" Secret, the password is
generated in the cluster and never stored in git; CNPG sets it on the managed
role (cnpg-cluster.yaml). `uri` is what the api reads as
MERIDIAN_DBVIEWER_DATABASE_URL (the -rw service: the viewer must reach the
primary the api writes its connection binding to).

Why the value stays put:
- `helm install/upgrade`: `lookup` returns the live Secret, whose `data` is
  re-emitted byte for byte; `helm.sh/resource-policy: keep` keeps it on
  uninstall.
- Argo CD renders with `helm template`, where `lookup` returns nothing, so
  every render carries a fresh random value. The values are under `data`
  (not `stringData`) so the Application's ignoreDifferences on
  /data/password and /data/uri covers exactly what is applied: the diff
  ignores them (no OutOfSync, no self-heal), and with
  RespectIgnoreDifferences=true a sync pre-patches those two fields with the
  live values before applying. A `stringData` key would be applied as-is,
  overwrite `data`, and rotate the password on every sync.
- The first sync has no live Secret, so the rendered value is applied once.
*/}}
{{- $name := printf "%s-dbviewer" .Values.cnpg.clusterName }}
{{- $ns := .Values.global.namespace }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- $data := dict }}
{{- if and $existing $existing.data (index $existing.data "password") (index $existing.data "uri") }}
{{- $_ := set $data "password" (index $existing.data "password") }}
{{- $_ := set $data "uri" (index $existing.data "uri") }}
{{- else }}
{{- $password := randAlphaNum 40 }}
{{- $_ := set $data "password" ($password | b64enc) }}
{{- $_ := set $data "uri" (printf "postgresql://meridian_dbviewer:%s@%s-rw.%s.svc:5432/%s" $password .Values.cnpg.clusterName $ns .Values.cnpg.database | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    cnpg.io/reload: "true"
  annotations:
    helm.sh/resource-policy: keep
data:
  username: {{ "meridian_dbviewer" | b64enc }}
  password: {{ $data.password }}
  uri: {{ $data.uri }}
{{- end }}
