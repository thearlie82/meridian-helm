{{- if and .Values.cnpg.enabled .Values.cnpg.dbViewer.enabled }}
{{- /*
The DB viewer's own Postgres login (meridian_dbviewer; Meridian DEPLOY.md
16.2). Like the app owner's "<clusterName>-app" Secret, the password is
generated in the cluster and never stored in git: created once here (kept on
upgrade via lookup, and by Argo CD through ignoreDifferences on /data), then
CNPG sets it on the managed role below. `uri` is what the api reads as
MERIDIAN_DBVIEWER_DATABASE_URL (the -rw service: the viewer must reach the
primary the api writes its connection binding to).
*/}}
{{- $name := printf "%s-dbviewer" .Values.cnpg.clusterName }}
{{- $ns := .Values.global.namespace }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    cnpg.io/reload: "true"
  annotations:
    helm.sh/resource-policy: keep
stringData:
  username: meridian_dbviewer
  password: {{ $password | quote }}
  uri: {{ printf "postgresql://meridian_dbviewer:%s@%s-rw.%s.svc:5432/%s" $password .Values.cnpg.clusterName $ns .Values.cnpg.database | quote }}
{{- end }}
